name: Harness Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The complete suite includes native Darwin benchmark publication. Keep those tests
    # on their real platform, and exercise the portable Pi boundary independently on Linux.
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 15 rejects exclusive renames of sealed (0555) directories with EACCES.
          # Use the current stable Darwin runner; never unseal a snapshot to publish it.
          - os: macos-26
            suite: full
            node: '22.23.2'
          - os: macos-26
            suite: full
            node: '24.11.0'
          - os: ubuntu-latest
            suite: portable-pi
            node: '24.11.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Generated prompts must match source
        run: git diff --exit-code -- agents skills dist
      - name: Native lifecycle and isolated browser regressions
        if: matrix.suite == 'full'
        # The CLI and HTTP-binding fixtures perform repeated native browser lifecycles. On shared
        # runners their strict close/runtime-snapshot deadlines can be starved by another test file.
        # Keep the deadlines and every assertion; run these entire files without competing files.
        run: >-
          node --test --test-concurrency=1
          test/benchmark-native-publish.test.ts test/benchmark-dependency-snapshot.test.ts
          test/browser-rs-doctor-runtime.test.ts test/harness-v2-cli.test.ts
          test/discovery-http-binding.test.ts test/cold-start-workflow.test.ts
          test/human-design-loop.test.ts test/static-direction-evidence.test.ts
      - name: Complete harness suite (including native Darwin publication)
        if: matrix.suite == 'full'
        # Shared Darwin runners showed compositor failures and 100ms VM deadline misses
        # in different tests under four concurrent files. Keep every test and its original
        # deadline/assertions; reduce scheduling pressure instead of retrying or weakening gates.
        shell: bash
        run: |
          suite_files=()
          for suite_file in test/*.test.ts; do
            # Already executed in full in the isolated step, not skipped or retried.
            if [[ "$suite_file" != "test/benchmark-native-publish.test.ts" && "$suite_file" != "test/benchmark-dependency-snapshot.test.ts" && "$suite_file" != "test/browser-rs-doctor-runtime.test.ts" && "$suite_file" != "test/harness-v2-cli.test.ts" && "$suite_file" != "test/discovery-http-binding.test.ts" && "$suite_file" != "test/cold-start-workflow.test.ts" && "$suite_file" != "test/human-design-loop.test.ts" && "$suite_file" != "test/static-direction-evidence.test.ts" ]]; then
              suite_files+=("$suite_file")
            fi
          done
          node --test --test-concurrency=2 "${suite_files[@]}"
      - name: Portable Pi gates, copy, and review loops
        if: matrix.suite == 'portable-pi'
        run: >-
          node --test --test-concurrency=4
          test/pi-extension.test.ts test/pi-host-guard.test.ts
          test/pi-stage-continuity.test.ts test/pi-repair-progress.test.ts
          test/route-bootstrap.test.ts test/adaptive-route-diagnostics.test.ts
          test/cold-start-workflow.test.ts
          test/production-reference-gate.test.ts test/first-render-critic.test.ts
          test/copy.test.ts test/slop-review.test.ts
          test/stateful-design-inspection.test.ts test/live-reference-flow.test.ts
          test/first-render-evidence.test.ts
          test/native-inspection-boundaries.test.ts
