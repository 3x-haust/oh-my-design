name: Plugin Security Scan
# Scan the current repository revision with the checked-in policy.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@5d17bb20ed8878ef1e82ed3ddf433522dbd36b26 # v1.2.532
        with:
          plugin_dir: "."
          config: ".plugin-scanner.toml"
          min_score: 80
          fail_on_severity: high
          format: json
          output: scanner-report.json
      - name: Print scanner report
        if: always()
        run: cat scanner-report.json || true
