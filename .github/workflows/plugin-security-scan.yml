name: Plugin Security Scan
# Scan the current repository revision with the checked-in policy.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@b6087cac286c39d504f9d0d8a45778da5ee6f1b9 # v1.2.658
        with:
          plugin_dir: "."
          config: ".plugin-scanner.toml"
          min_score: 80
          fail_on_severity: high
          format: json
          output: scanner-report.json
      - name: Print scanner report
        if: always()
        run: cat scanner-report.json || true
