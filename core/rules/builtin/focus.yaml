id: FOCUS-001
layer: 1
category: a11y
severity: warn
when: "node.parent === null && ir.meta && ir.meta.interaction && Number.isFinite(ir.meta.interaction.tabStops) && ir.meta.interaction.tabStops > 0 && Number.isFinite(ir.meta.interaction.focusVisible)"
value: "Math.max(0, ir.meta.interaction.tabStops - ir.meta.interaction.focusVisible)"
assert: "value === 0"
message: "{value} tab stop(s) lack a visible focus indicator. Every tab stop must show focus; partial coverage still leaves keyboard users without a visible location."
