<!doctype html><html lang="ko"><meta charset="utf-8"><title>Application preparation</title>
<style>
@font-face{font-family:"OMD Geometry Fixture";src:url(assets/geometry-hangul.ttf)}
:root{--canvas:#f5f7f3;--ink:#17211e;--accent:#176b5b}*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:Manrope,"OMD Geometry Fixture",sans-serif}
header{padding:24px;border-bottom:1px solid #dfe5df;font-size:12px}main{max-width:1100px;margin:auto;padding:24px}
.hero{padding:64px 0 72px}.hero h1{font-size:56px;line-height:1.2;margin:0 0 24px;font-weight:700}
.hero p{font-size:16px;line-height:1.8}.kicker{font:12px "DM Mono",monospace;color:var(--accent)}
.task{padding:24px;background:white;border:1px solid #dfe5df;border-radius:8px}h2{font-size:24px;line-height:1.35}
.source{font:10px/1.4 "DM Mono",monospace;color:#999}.status{font-size:11px;line-height:1.4;color:#999}.clipped{height:8px;overflow:hidden}
button{font:700 12px/1.4 Manrope,"OMD Geometry Fixture",sans-serif;background:var(--accent);color:white;padding:12px;border:0}
@media(max-width:700px){.hero{padding:24px 0}.hero h1{font-size:39px}.hero p{font-size:13px}.task{padding:12px}}
@media(max-width:400px){button{inline-size:4em;word-break:break-all}}
</style>
<header>Local application workspace</header><main><section class="hero"><span class="kicker">APPLICATION DESK</span><h1>Prepare your next application</h1><p>Review the documents and check the official source.</p></section>
<section class="task" aria-label="Application work object"><h2>Required documents</h2><p class="status">Draft only; not submitted</p><p class="source">Source: local demonstration record</p><p class="status clipped">A full status explanation that the container clips.</p><button type="button">신청서<span>확인하기</span></button></section></main></html>
