<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trusted lifecycle fixture</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui; }
      main { display: grid; gap: 16px; width: min(420px, calc(100vw - 32px)); }
      button { min-height: 48px; font: inherit; }
      [role="status"] { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <button id="submit" type="button">Submit order</button>
      <p role="status" hidden>Order submitted</p>
    </main>
    <script>
      document.querySelector('#submit').addEventListener('click', () => {
        document.querySelector('[role="status"]').hidden = false;
      });
    </script>
  </body>
</html>
