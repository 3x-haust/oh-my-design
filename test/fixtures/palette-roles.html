<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        --coral: #ff5b55;
        --lime: #d8ff45;
        --blue: #3e63dd;
      }
      body { margin: 0; }
      .coral { width: 100px; height: 100px; background: var(--coral); }
      .lime { width: 100px; height: 100px; border: 4px solid var(--lime); }
      .blue { color: var(--blue); }
      .error { width: 100px; height: 100px; background: var(--coral); }
      .success { width: 100px; height: 100px; border: 4px solid var(--lime); }
    </style>
  </head>
  <body>
    <div class="coral"></div>
    <div class="lime"></div>
    <p class="blue">도시의 에너지</p>
    <div class="error" role="alert"></div>
    <div class="success" data-omd-color-role="success"></div>
  </body>
</html>
