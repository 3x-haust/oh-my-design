<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selected reference fidelity fail fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #101010; color: #f8e8bd; font-family: Georgia, serif; }
      [data-omd="shop-hero"] {
        min-height: 260px;
        padding: 3px 97px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-radius: 999px;
      }
      h1 { max-width: none; margin: 0; font-size: 21px; font-weight: 300; line-height: 1.8; }
      p { max-width: 30ch; margin: 0; font-size: 11px; line-height: 2.2; }
      button { border: 7px double #f8e8bd; border-radius: 999px; padding: 3px 48px; background: transparent; color: inherit; font: 300 11px Georgia, serif; }
      aside { padding: 3px; border-radius: 999px; background: transparent; }
    </style>
  </head>
  <body>
    <main data-omd="shop-hero">
      <section>
        <h1>This surface deliberately breaks the selected visual system.</h1>
        <p>Its spacing, density, typography, alignment, geometry, and material treatment are intentionally unrelated.</p>
        <button type="button">Mismatched action</button>
      </section>
      <aside>
        <strong>Contradictory proof</strong>
        <p>The content remains complete while the visual invariants diverge.</p>
      </aside>
    </main>
  </body>
</html>
