<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selected reference fidelity pass fixture</title>
    <style>
      :root { --canvas: #ffffff; --ink: #172033; --accent: #2857d9; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--canvas); color: var(--ink); font-family: Arial, sans-serif; }
      [data-omd="shop-hero"] {
        min-height: 720px;
        padding: 64px 72px;
        display: grid;
        grid-template-columns: 1.4fr 0.6fr;
        gap: 40px;
        align-items: center;
      }
      h1 { max-width: 12ch; margin: 0 0 24px; font-size: 64px; line-height: 1; }
      p { max-width: 58ch; margin: 0 0 24px; font-size: 18px; line-height: 1.55; }
      button { border: 0; border-radius: 8px; padding: 14px 22px; background: var(--accent); color: white; font: 700 16px Arial, sans-serif; }
      aside { padding: 32px; border-radius: 16px; background: #eef2ff; }
    </style>
  </head>
  <body>
    <main data-omd="shop-hero">
      <section>
        <h1>Make the selected direction observable.</h1>
        <p>The primary hierarchy, spacing rhythm, typography, and supporting proof are all measurable at the assigned destination selector.</p>
        <button type="button">Continue with this direction</button>
      </section>
      <aside>
        <strong>Reference-bound proof</strong>
        <p>This supporting region keeps the page complete enough for real browser extraction.</p>
      </aside>
    </main>
  </body>
</html>
