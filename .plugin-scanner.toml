# Scanner scope: test and internal process adapters are not shipped plugin surfaces.
[scanner]
ignore_paths = [
  "test/*",
  "scripts/benchmark/*",
  "bin/run-ts.mjs",
  "adapters/reviewer-mcp.ts",
  "core/install/browser-rs-health.ts",
  "core/install/browser-rs-smoke.ts",
  "core/install/browser-rs-stdio.ts"
]
